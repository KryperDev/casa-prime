name: casa_prime
description: "Casa Prime - Gerenciamento Financeiro Familiar. Criado por Anderson Scantamburlo."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.2
  cloud_functions: ^6.0.2
  firebase_storage: ^13.0.1

  # Estado e arquitetura
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  provider: ^6.1.5+1

  # Imagens / Cloudinary
  image_picker: ^1.2.0
  cloudinary_public: ^0.23.1

  # Gráficos
  fl_chart: ^1.1.0

  # Formatação e utilidades
  intl: ^0.20.2
  uuid: ^4.5.1

  # Exportação
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^12.0.0
  path_provider: ^2.1.5

  # Offline
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.5.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true